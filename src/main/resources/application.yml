# CONFIGURACION BASE (ComÃºn para todos)

spring:
  application:
    name: ms-comentarios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}
            loggerLevel: basic

ms:
  inquilinos:
    url: ${MS_INQUILINOS_URL:http://localhost:8083}
  propiedades:
    url: ${MS_PROPIEDADES_URL:http://localhost:8081}

server:
  port: 8080
  forward-headers-strategy: framework

---

# PERFIL DE DESARROLLO (dev)

spring:
  config:
    activate:
      on-profile: dev

  # Base de datos MySQL de desarrollo
  datasource:
    url: jdbc:mysql://localhost:3306/db_comentarios_dev
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Estrategia de Hibernate para desarrollo
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

# DocumentaciÃ³n interactiva con Swagger UI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

# ENLACE CON LA TORRE DE CONTROL EUREKA
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

---

# PERFIL DE PRUEBAS (test)

spring:
  config:
    activate:
      on-profile: test

  # Base de datos MySQL de pruebas
  datasource:
    url: jdbc:h2:mem:comentarios_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Limpieza absoluta de tablas en cada ejecuciÃ³n de test
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop

# Desactivar Swagger en tests para acelerar el arranque
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# URL ficticia para simular llamadas Feign en ambiente de pruebas
ms:
  inquilinos:
    url: http://localhost:9999
  propiedades:
    url: http://localhost:9999

---

# PERFIL DE PRODUCCIÃ“N (prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

ms:
  inquilinos:
    url: ${MS_INQUILINOS_URL}
  propiedades:
    url: ${MS_PROPIEDADES_URL}
